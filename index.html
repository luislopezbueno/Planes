<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Planes por Madrid</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#3b3320; --muted:#8a7f63;
  --yellow:#fff1a8; --yellow-h:#ffe988; --yellow-line:#f1d96a;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
main{max-width:560px;margin:0 auto;padding:48px 20px 56px;text-align:center}
h1{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;letter-spacing:-.02em;margin:0 0 8px;line-height:1.05}
.sub{color:var(--muted);margin:0 0 28px;font-size:1.05rem}
.stack{display:flex;flex-direction:column;gap:14px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{font:inherit}
button.fit{display:block;width:100%;font-weight:700;font-size:1.25rem;color:var(--ink);background:var(--yellow);
  border:2px solid var(--yellow-line);border-radius:20px;padding:20px 24px;cursor:pointer;transition:background .15s,transform .1s}
.cats button.fit{font-size:1.05rem;padding:16px 10px;border-radius:16px}
button.fit:hover{background:var(--yellow-h)}
button.fit:active{transform:scale(.98)}
button.fit[aria-pressed="true"]{background:var(--yellow-h);border-color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.resultado{margin-top:32px;min-height:150px;padding:28px 20px;border:2px dashed var(--yellow-line);border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.vacio{color:var(--muted)}
.nombre{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:800;line-height:1.1;margin:0;overflow-wrap:anywhere}
.tipo{display:inline-block;background:var(--yellow);border-radius:999px;padding:4px 14px;font-size:.95rem;font-weight:500}
.otra,.volver{font-size:1rem;background:#fff;color:var(--ink);border:2px solid var(--yellow-line);border-radius:999px;padding:10px 20px;cursor:pointer}
.otra{margin-top:14px}
.volver{margin-top:28px;width:100%;font-size:1.05rem;padding:14px 20px}
.otra:hover,.volver:hover{background:var(--yellow)}
.dir{margin-top:6px;width:100%}
.dir select{font-size:1rem;padding:8px 12px;border-radius:12px;border:2px solid var(--yellow-line);background:#fff;color:var(--ink);max-width:100%;margin-bottom:12px}
.maps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.maps a{display:inline-block;text-decoration:none;color:var(--ink);background:var(--yellow);border:2px solid var(--yellow-line);
  border-radius:999px;padding:10px 18px;font-weight:700;font-size:.95rem}
.maps a:hover{background:var(--yellow-h)}
.todos{margin-top:16px;font-size:.95rem;color:var(--muted)}
.todos summary{cursor:pointer}
.todos ul{list-style:none;padding:0;margin:8px 0 0}
.todos li{padding:2px 0}
.alea-btn{margin-top:26px}
.cat-titulo{font-size:1.6rem;font-weight:800;margin:0 0 20px}
.item{display:block}
.item.abierto button.fit{background:var(--yellow-h);border-bottom-left-radius:0;border-bottom-right-radius:0}
.panel{border:2px solid var(--yellow-line);border-top:0;border-radius:0 0 20px 20px;padding:18px 14px 20px;background:#fffbe3}
.panel .dir{margin-top:0}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}button.fit{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Planes por Madrid</h1>
  <section id="home">
    <p class="sub">¿Qué te apetece?</p>
    <div class="cats" id="cats" role="group" aria-label="Categorías"></div>
    <button type="button" class="fit alea-btn" id="btnAlea"><span>Aleatorio</span></button>
  </section>
  <section id="lista" hidden>
    <h2 class="cat-titulo" id="listaTitulo"></h2>
    <div class="stack" id="items"></div>
    <button type="button" class="volver" id="btnVolver2">Volver</button>
  </section>
  <section id="alea" hidden>
    <p class="sub">Deja que decida la suerte.</p>
    <div class="stack" role="group" aria-label="Tipo de plan">
      <button type="button" class="fit" data-pool="restaurantes" data-max="54" aria-pressed="false"><span>Restaurantes</span></button>
      <button type="button" class="fit" data-pool="cafeterias" data-max="54" aria-pressed="false"><span>Cafeterías</span></button>
    </div>
    <div class="resultado" id="res2" aria-live="polite"><span class="vacio">Elige una opción para ver tu plan.</span></div>
    <button type="button" class="volver" id="btnVolver">Volver</button>
  </section>
</main>

var miPos=null, ubicEstado=0;
function limpio(n){ return n.replace(/\s*\(.*\)\s*$/,""); }
function km(a,b,c,d){ var r=Math.PI/180, x=(c-a)*r, y=(d-b)*r*Math.cos((a+c)/2*r); return 6371*Math.sqrt(x*x+y*y); }
function fmt(k){ return k<1 ? (Math.round(k*100)*10)+" m" : k.toFixed(1).replace(".",",")+" km"; }
function dist(l){ return km(miPos[0],miPos[1],l[2],l[3]); }
function construir(base){
  var lugares=DIRS[base], lista=lugares?lugares.slice():null;
  if(lista && miPos) lista.sort(function(p,q){ return dist(p)-dist(q); });
  var box=document.createElement("div"); box.className="dir";
  var sel=null;
  if(lista && lista.length>1){
    sel=document.createElement("select"); sel.setAttribute("aria-label","Elige el local");
    lista.forEach(function(l,i){ var o=document.createElement("option"); o.value=i; o.textContent=(l[0]||l[1])+(miPos?" · "+fmt(dist(l)):""); sel.appendChild(o); });
    box.appendChild(sel);
  }
  var maps=document.createElement("div"); maps.className="maps";
  var g=document.createElement("a"), a=document.createElement("a");
  [g,a].forEach(function(x){ x.target="_blank"; x.rel="noopener"; maps.appendChild(x); });
  box.appendChild(maps);
  function pintar(){
    var l=lista?lista[sel?sel.value:0]:null, q;
    if(l){
      q=encodeURIComponent(base+", "+l[1]);
      g.href="https://www.google.com/maps/dir/?api=1&destination="+q;
      a.href="https://maps.apple.com/?daddr="+q+"&dirflg=d";
    } else {
      q=encodeURIComponent(base+" Madrid");
      g.href="https://www.google.com/maps/search/?api=1&query="+q;
      a.href="https://maps.apple.com/?q="+q;
    }
    g.textContent="Google Maps"; a.textContent="Apple Maps";
  }
  if(sel) sel.addEventListener("change",pintar);
  pintar();
  if(lista && lista.length>1 && !miPos && navigator.geolocation && ubicEstado===0){
    ubicEstado=1;
    navigator.geolocation.getCurrentPosition(function(p){
      miPos=[p.coords.latitude,p.coords.longitude]; ubicEstado=3;
      if(box.parentNode) box.replaceWith(construir(base));
    },function(){ ubicEstado=2; },{timeout:10000});
  }
  return box;
}
function agregarDireccion(cont,nombre){ cont.appendChild(construir(limpio(nombre))); }

function aplanar(grupos){
  var out=[];
  Object.keys(grupos).forEach(function(tipo){
    grupos[tipo].forEach(function(e){
      out.push({nombre:Array.isArray(e)?e[0]:e,tipo:tipo,nota:Array.isArray(e)?e[1]:""});
    });
  });
  return out;
}

  $("#listaTitulo").textContent=c[0];

  c[1].forEach(function(e){
    var it=document.createElement("div"); it.className="item";

}
